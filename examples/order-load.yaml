name: "Order Processing Benchmark"
target: "http://localhost:8080/api/v1/orders"
method: "POST"
concurrency: 50
duration: "15s"
warmup: "2s"
rps: 1000
timeout: "5s"
headers:
  Content-Type: "application/json"
  X-Request-Id: "{{ uuid() }}"
body: |
  {
    "orderId": "{{ uuid() }}",
    "customerId": "CUST-{{ random_int(100, 999) }}",
    "amount": {{ random_int(10, 500) }},
    "timestamp": {{ timestamp() }},
    "note": "Load test batch {{ counter() }}"
  }
assertion: "p99 < 50ms && error_rate < 0.01"
