<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="28" y="28" width="968" height="968" rx="220" />
    </clipPath>

    <!-- Linear Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="cyan-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>

    <linearGradient id="obsidian-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="slate-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="slate-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="slate-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for Gateway -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>

    <filter id="cyan-bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00f5ff" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="28" y="28" width="968" height="968" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#shadow)">

      <!-- Hexagonal Architectural Gateway Frame -->
      <polygon points="
        0,-380
        329,-190
        329,190
        0,380
        -329,190
        -329,-190
      " fill="none" stroke="#0f172a" stroke-width="32" stroke-linejoin="round" />

      <!-- Inner Dashed Telemetry Hexagon -->
      <polygon points="
        0,-345
        299,-172
        299,172
        0,345
        -299,172
        -299,-172
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.5" stroke-dasharray="16, 12" />

      <!-- Hexagon Telemetry Nodes -->
      <circle cx="0" cy="-345" r="6" fill="#00f5ff" />
      <circle cx="299" cy="-172" r="6" fill="#00f5ff" />
      <circle cx="299" cy="172" r="6" fill="#00f5ff" />
      <circle cx="0" cy="345" r="6" fill="#00f5ff" />
      <circle cx="-299" cy="172" r="6" fill="#00f5ff" />
      <circle cx="-299" cy="-172" r="6" fill="#00f5ff" />

      <!-- ==================== MASCOT: THE OBSIDIAN CHEETAH ==================== -->

      <!-- 1. Base Silhouette (Cheetah Head Outer Mass) -->
      <path d="
        M 0,-185
        C -40,-185 -70,-175 -95,-155
        L -185,-275
        C -195,-285 -205,-270 -200,-255
        L -165,-105
        C -190,-60 -235,10 -235,50
        C -235,85 -215,115 -180,140
        L -140,240
        L -60,285
        L 0,310
        L 60,285
        L 140,240
        L 180,140
        C 215,115 235,85 235,50
        C 235,10 190,-60 165,-105
        L 200,-255
        C 205,-270 195,-285 185,-275
        L 95,-155
        C 70,-175 40,-185 0,-185
        Z
      " fill="url(#obsidian-dark)" />

      <!-- 2. Chest Armor Shield -->
      <polygon points="0,170 -130,225 -55,290 0,310" fill="url(#slate-deep)" />
      <polygon points="0,170 130,225 55,290 0,310" fill="url(#slate-mid)" />

      <!-- 3. Heartbeat Pulse Wave Accent (LoadPulse Core) -->
      <polyline points="-120,230 -60,230 -35,190 -10,265 10,190 35,265 60,230 120,230"
        fill="none" stroke="url(#cyan-glow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyan-bloom)" />

      <!-- 4. Outer Cheeks Aerodynamic Contours -->
      <polygon points="-95,-155 -165,-105 -195,-15 -115,10 -75,-65" fill="url(#slate-deep)" />
      <polygon points="95,-155 165,-105 195,-15 115,10 75,-65" fill="url(#slate-light)" />

      <polygon points="-195,-15 -235,50 -170,115 -115,10" fill="url(#obsidian-dark)" />
      <polygon points="195,-15 235,50 170,115 115,10" fill="url(#slate-mid)" />

      <!-- 5. Inner Ear Cavities (Glowing Electric Cyan) -->
      <polygon points="-95,-155 -180,-255 -145,-120" fill="url(#cyan-glow)" opacity="0.9" />
      <polygon points="95,-155 180,-255 145,-120" fill="url(#cyan-bright)" opacity="0.95" />

      <!-- 6. Forehead Geometric Facets -->
      <polygon points="0,-185 -75,-140 0,-70" fill="url(#slate-deep)" />
      <polygon points="0,-185 75,-140 0,-70" fill="url(#slate-light)" />

      <polygon points="-75,-140 -95,-155 -75,-65 -45,-60" fill="url(#slate-mid)" />
      <polygon points="75,-140 95,-155 75,-65 45,-60" fill="url(#slate-light)" />

      <!-- Center Pulse Crest (Amber / Cyan Peak) -->
      <polygon points="0,-180 -18,-135 0,-115 18,-135" fill="url(#cyan-bright)" filter="url(#cyan-bloom)" />

      <!-- 7. Eyebrow Ridges -->
      <polygon points="0,-70 -45,-60 -90,-35 -35,-30" fill="url(#slate-deep)" />
      <polygon points="0,-70 45,-60 90,-35 35,-30" fill="url(#slate-mid)" />

      <!-- 8. Bridge of Muzzle -->
      <polygon points="0,-70 -35,-30 -28,55 0,60" fill="url(#slate-deep)" />
      <polygon points="0,-70 35,-30 28,55 0,60" fill="url(#slate-mid)" />

      <!-- 9. Cheetah Tear-Stripe Telemetry Channels (Signature Marking) -->
      <path d="
        M -35,-25
        C -32,15 -42,50 -55,95
        L -70,90
        C -55,45 -48,15 -48,-25
        Z
      " fill="#020617" />

      <path d="
        M 35,-25
        C 32,15 42,50 55,95
        L 70,90
        C 55,45 48,15 48,-25
        Z
      " fill="#020617" />

      <!-- 10. Piercing Electric Cyan Feline Eyes -->
      <!-- Left Eye -->
      <path d="
        M -36,-26
        C -55,-40 -78,-38 -92,-24
        C -78,-16 -55,-16 -36,-26
        Z
      " fill="url(#cyan-glow)" filter="url(#cyan-bloom)" />

      <!-- Left Pupil & Eyelid Edge -->
      <polygon points="-68,-33 -62,-33 -60,-20 -66,-20" fill="#020617" />
      <circle cx="-70" cy="-28" r="2.5" fill="#ffffff" />

      <!-- Right Eye -->
      <path d="
        M 36,-26
        C 55,-40 78,-38 92,-24
        C 78,-16 55,-16 36,-26
        Z
      " fill="url(#cyan-bright)" filter="url(#cyan-bloom)" />

      <!-- Right Pupil & Eyelid Edge -->
      <polygon points="68,-33 62,-33 60,-20 66,-20" fill="#020617" />
      <circle cx="66" cy="-28" r="2.5" fill="#ffffff" />

      <!-- 11. Muzzle Whisker Pads & Jaw -->
      <polygon points="-28,55 -85,70 -65,120 -20,95" fill="url(#obsidian-dark)" />
      <polygon points="28,55 85,70 65,120 20,95" fill="url(#slate-mid)" />

      <polygon points="-85,70 -140,40 -160,105 -65,120" fill="url(#slate-deep)" />
      <polygon points="85,70 140,40 160,105 65,120" fill="url(#slate-light)" />

      <!-- 12. Geometric Nose Pad -->
      <path d="
        M -24,60
        C -10,56 10,56 24,60
        L 16,88
        C 6,94 -6,94 -16,88
        Z
      " fill="#020617" />
      <polyline points="-18,63 0,60 18,63" fill="none" stroke="#00f5ff" stroke-width="2" opacity="0.6" />

      <!-- 13. Mouth & Chin -->
      <polygon points="0,92 -20,125 0,135" fill="url(#slate-deep)" />
      <polygon points="0,92 20,125 0,135" fill="url(#slate-light)" />
      <polygon points="-20,125 -15,160 0,170 15,160 20,125 0,135" fill="url(#obsidian-dark)" stroke="#1e293b" stroke-width="1.5" />

    </g>
  </g>
</svg>