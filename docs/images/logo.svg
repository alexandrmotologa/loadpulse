<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="cyan-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="amber-pulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <linearGradient id="slate-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="slate-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="slate-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="obsidian-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>

    <filter id="eye-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f5ff" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="36" stroke-linejoin="round" />

      <!-- Inner Precision Dashed Telemetry Hexagon -->
      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.45" stroke-dasharray="16, 12" />

      <!-- Telemetry Sub-Ring Pulse Markers -->
      <circle cx="0" cy="-355" r="6" fill="#00f5ff" opacity="0.8"/>
      <circle cx="307" cy="-177" r="6" fill="#00f5ff" opacity="0.8"/>
      <circle cx="307" cy="177" r="6" fill="#00f5ff" opacity="0.8"/>
      <circle cx="0" cy="355" r="6" fill="#00f5ff" opacity="0.8"/>
      <circle cx="-307" cy="177" r="6" fill="#00f5ff" opacity="0.8"/>
      <circle cx="-307" cy="-177" r="6" fill="#00f5ff" opacity="0.8"/>

      <!-- MASCOT: THE OBSIDIAN CHEETAH (Speed, High-Frequency Pulse & Microsecond Precision) -->

      <!-- Background Chest & Flank Armor -->
      <polygon points="-160,100 -70,165 -140,265 -200,180" fill="url(#obsidian-deep)" />
      <polygon points="160,100 70,165 140,265 200,180" fill="url(#slate-grad-dark)" />

      <polygon points="0,150 -70,165 -45,280 0,310" fill="url(#slate-grad-dark)" />
      <polygon points="0,150 70,165 45,280 0,310" fill="url(#slate-grad-2)" />

      <!-- Pulse Wave Accent across Chest Plate -->
      <polyline points="-130,220 -60,220 -35,185 -10,255 10,185 35,255 60,220 130,220"
        fill="none" stroke="url(#cyan-glow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Ears Outer Facets -->
      <polygon points="-90,-130 -185,-285 -125,-100" fill="url(#slate-grad-dark)" />
      <polygon points="90,-130 185,-285 125,-100" fill="url(#slate-grad-2)" />

      <!-- Ears Inner Recess (Electric Cyan Core) -->
      <polygon points="-95,-135 -170,-265 -130,-115" fill="url(#cyan-glow)" opacity="0.85" />
      <polygon points="95,-135 170,-265 130,-115" fill="url(#cyan-light)" opacity="0.95" />

      <!-- Cheek / Jowl Outer Aerodynamic Wings -->
      <polygon points="-125,-100 -235,-25 -145,25 -85,-45" fill="url(#slate-grad-dark)" />
      <polygon points="125,-100 235,-25 145,25 85,-45" fill="url(#slate-grad-1)" />

      <polygon points="-235,-25 -250,70 -160,105 -145,25" fill="url(#obsidian-deep)" />
      <polygon points="235,-25 250,70 160,105 145,25" fill="url(#slate-grad-2)" />

      <!-- Forehead & Crown Facets -->
      <polygon points="0,-220 -65,-135 0,-85" fill="url(#slate-grad-dark)" />
      <polygon points="0,-220 65,-135 0,-85" fill="url(#slate-grad-1)" />

      <polygon points="-65,-135 -125,-100 -85,-45 -45,-50" fill="url(#slate-grad-2)" />
      <polygon points="65,-135 125,-100 85,-45 45,-50" fill="url(#slate-grad-1)" />

      <!-- Forehead Pulse Crystal (Amber / Gold Accent) -->
      <polygon points="0,-215 -22,-170 0,-145 22,-170" fill="url(#amber-pulse)" />

      <!-- Bridge of Nose -->
      <polygon points="0,-85 -45,-50 -32,15 0,20" fill="url(#slate-grad-dark)" />
      <polygon points="0,-85 45,-50 32,15 0,20" fill="url(#slate-grad-1)" />

      <polygon points="0,20 -32,15 -28,70 0,75" fill="url(#slate-grad-dark)" />
      <polygon points="0,20 32,15 28,70 0,75" fill="url(#slate-grad-2)" />

      <!-- Cheetah Tear-Stripe Telemetry Channels -->
      <polygon points="-45,-25 -38,25 -52,90 -66,90 -52,25" fill="#020617" />
      <polygon points="45,-25 38,25 52,90 66,90 52,25" fill="#0f172a" />

      <!-- Feline Eyes (Electric Cyan Glowing Optics) -->
      <polygon points="-85,-40 -45,-32 -42,-18 -82,-26" fill="url(#cyan-glow)" filter="url(#eye-glow)" />
      <polygon points="85,-40 45,-32 42,-18 82,-26" fill="url(#cyan-light)" filter="url(#eye-glow)" />

      <!-- Eye Pupils (Vertical Slits) -->
      <polygon points="-64,-36 -62,-36 -61,-21 -65,-21" fill="#020617" />
      <polygon points="64,-36 62,-36 61,-21 65,-21" fill="#020617" />

      <!-- Whiskers / Snout Side Plates -->
      <polygon points="-28,70 -80,80 -65,130 -22,100" fill="url(#obsidian-deep)" />
      <polygon points="28,70 80,80 65,130 22,100" fill="url(#slate-grad-2)" />

      <polygon points="-80,80 -145,25 -160,105 -65,130" fill="url(#slate-grad-dark)" />
      <polygon points="80,80 145,25 160,105 65,130" fill="url(#slate-grad-1)" />

      <!-- Nose Pad -->
      <polygon points="0,75 -28,70 -18,100 0,108 18,100 28,70" fill="#020617" />
      <polygon points="0,75 28,70 18,100 0,108" fill="#0f172a" />

      <!-- Chin & Mouth -->
      <polygon points="0,108 -22,140 0,150" fill="url(#slate-grad-dark)" />
      <polygon points="0,108 22,140 0,150" fill="url(#slate-grad-1)" />
      <polygon points="-22,100 -22,140 0,150" fill="#0b0f19" />
      <polygon points="22,100 22,140 0,150" fill="#1e293b" />

    </g>
  </g>
</svg>