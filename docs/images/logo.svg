<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9" />
    </linearGradient>

    <!-- Energy Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Squircle Outer Shell -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#softShadow)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Inner Dynamic Ring Grid -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />

  <!-- Vertical Coordinate Axis -->
  <line x1="256" y1="96" x2="256" y2="416" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6" />
  <line x1="96" y1="256" x2="416" y2="256" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6" />

  <!-- Pulse Wave Shadow Glow -->
  <path d="M 80 256 L 140 256 L 175 220 L 205 285 L 245 125 L 285 385 L 320 200 L 350 280 L 380 256 L 432 256"
        fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.25" filter="url(#glow)" />

  <!-- Main Radiant Pulse Wave -->
  <path d="M 80 256 L 140 256 L 175 220 L 205 285 L 245 125 L 285 385 L 320 200 L 350 280 L 380 256 L 432 256"
        fill="none" stroke="url(#pulseGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Precision Indicator Dots -->
  <circle cx="245" cy="125" r="7" fill="#ffffff" filter="url(#glow)" />
  <circle cx="245" cy="125" r="4" fill="#38bdf8" />

  <circle cx="285" cy="385" r="7" fill="#ffffff" filter="url(#glow)" />
  <circle cx="285" cy="385" r="4" fill="#10b981" />

  <circle cx="320" cy="200" r="5" fill="#a855f7" />
  <circle cx="205" cy="285" r="5" fill="#06b6d4" />

  <!-- Velocity Chevron Accents -->
  <path d="M 400 240 L 416 256 L 400 272" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 416 240 L 432 256 L 416 272" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- Subtle Emblem Badge Ring Highlight -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />
</svg>