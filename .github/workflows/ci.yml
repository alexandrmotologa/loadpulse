name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean verify -B

      - name: Run Self-Benchmarking Verification
        run: |
          java -jar target/loadpulse.jar mock -p 18080 --delay 2ms &
          MOCK_PID=$!
          sleep 2
          java -jar target/loadpulse.jar run http://localhost:18080/bench -c 50 -d 5s --warmup 1s --no-tui --assert "p99 < 50ms && error_rate < 0.05"
          kill $MOCK_PID
